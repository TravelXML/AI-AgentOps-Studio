[project]
name = "agentq-api"
version = "0.1.0"
description = "AgentQ FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "agentq-flowspec",
    "agentq-runtime",
    "agentq-model-gateway",
    "agentq-observability",
    "agentq-security",
    "agentq-evaluation",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pgvector>=0.3",
    "pypdf>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
agentq-flowspec = { workspace = true }
agentq-runtime = { workspace = true }
agentq-model-gateway = { workspace = true }
agentq-observability = { workspace = true }
agentq-security = { workspace = true }
agentq-evaluation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentq_api"]
