[project]
name = "agentq-flowspec"
version = "0.1.0"
description = "FlowSpec — framework-neutral agent workflow specification"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowspec"]
