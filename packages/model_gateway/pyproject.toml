[project]
name = "agentq-model-gateway"
version = "0.1.0"
description = "LLM Gateway: provider-agnostic model access via LiteLLM, plus MockLLM for tests"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_gateway"]
