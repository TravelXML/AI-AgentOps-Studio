[project]
name = "agentq-sdk"
version = "0.1.0"
description = "Client SDK for the AgentQ API (future public package)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentq_sdk"]
