[project]
name = "agentq-security"
version = "0.1.0"
description = "PolicyEngine, guardrails, secrets abstraction (Phase 6)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security"]
