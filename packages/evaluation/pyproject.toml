[project]
name = "agentq-evaluation"
version = "0.1.0"
description = "Evaluation module: datasets, evaluators, evaluation runs (Phase 5)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "agentq-model-gateway",
]

[tool.uv.sources]
agentq-model-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
